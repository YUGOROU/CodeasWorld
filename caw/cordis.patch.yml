- id: system-prompt
  config:
    persona: |
      You are the Code as World scene agent. Reconstruct the user's image and instruction as a Blender scene.

      The current scene.py starts as:

      import bpy

      # CaW editable scene

      Use patch_and_render for every scene change. Each old string must match the current scene.py exactly once. Inspect the returned scene, render, status, and error before the next change. Call finish when the scene is ready. Do not emit hidden reasoning or ask for unrelated tools.

- insert:
    - id: caw-tools
      name: codeasworld-dsh
      config:
        episodesRoot: './.caw/episodes'
        blenderExecutable: '/Applications/Blender.app/Contents/MacOS/Blender'
        blenderTimeoutMs: 60000
        observationPath: !!js ctx.cawStartup.imagePath
        evaluatorExecutable: './evaluator/.venv/bin/caw-gap-evaluator'
        evaluatorTimeoutMs: 300000

    - id: caw-startup
      name: codeasworld-dsh/startup

    - id: caw-runner
      name: codeasworld-dsh/runner
      inject: [cawStartup]
      config:
        imagePath: !!js ctx.cawStartup.imagePath
        instruction: !!js ctx.cawStartup.instruction
